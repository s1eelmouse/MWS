name: compactfactextraction

services:
  extractor:
    build:
      context: .
      target: extractor
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: compactfactextraction:${TAG:-cpu}
    init: true
    ports:
      - "${PORT:-8000}:8000"
    environment:
      MODEL_DIR: /models/merged
      # Final submission profile: final-005-v2 (see docs/DOCKER_SUBMISSION.md)
      MAX_BATCH: ${MAX_BATCH:-4}
      WITH_SCHEMA: ${WITH_SCHEMA:-0}
      ALLOW_LEGACY_CONTRACT: ${ALLOW_LEGACY_CONTRACT:-0}
      JSON_CONSTRAINED: "1"
      JSON_GRAMMAR_BACKEND: ${JSON_GRAMMAR_BACKEND:-torch_native}
      JSON_GRAMMAR_THREADS: ${JSON_GRAMMAR_THREADS:-4}
      MAX_INPUT_TOKENS: "12288"
      MAX_SEQUENCE_TOKENS: "16384"
      MAX_NEW_TOKENS: "4096"
      RETRY_ON_TOKEN_LIMIT: "1"
      RETRY_REPETITION_PENALTY: "1.2"
      PROMPT_LOOKUP_TOKENS: "0"
      TEMPORAL_SERIES_HISTORY: ${TEMPORAL_SERIES_HISTORY:-1}
      TEMPORAL_SERIES_MAX_ENTRIES: "10000"
      TEMPORAL_NORMALIZATION: ${TEMPORAL_NORMALIZATION:-case_v2}
      FACT_RECOVERY: ${FACT_RECOVERY:-1}
      TARIFF_BOUNDARY_POLICY: ${TARIFF_BOUNDARY_POLICY:-explicit}
      OMP_NUM_THREADS: "4"
      CATALOG_PATH: /app/catalog.json
      TEMPORAL_CATALOG_PATH: /app/catalog.json
    volumes:
      - type: bind
        source: ${CATALOG_FILE:-./case_data/catalog.json}
        target: /app/catalog.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MODEL_PATH:-./models/005-v2-final/merged}
        target: /models/merged
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: hf-cache
        target: /cache/huggingface

volumes:
  hf-cache:
